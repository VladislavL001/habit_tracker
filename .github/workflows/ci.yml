name: CI

on:
  push:
    branches:
      - feature/coursework

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: habit_tracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d habit_tracker"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root --no-interaction --no-ansi

      - name: Run tests
        env:
          DB_NAME: habit_tracker
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          SECRET_KEY: test-secret-key
          DEBUG: "True"
          TELEGRAM_BOT_TOKEN: test-token
        run: poetry run python manage.py test

      - name: Run flake8
        run: poetry run flake8

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t registry.yandexcloud.net/cn1jll5vhohtmitcgj18/habit-tracker:${{ github.sha }} .

          docker tag \
            registry.yandexcloud.net/cn1jll5vhohtmitcgj18/habit-tracker:${{ github.sha }} \
            registry.yandexcloud.net/cn1jll5vhohtmitcgj18/habit-tracker:latest

      - name: Login to Yandex Cloud Registry
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
        run: |
          echo "$YANDEX_API_KEY" | \
            docker login \
              --username api_key \
              --password-stdin \
              registry.yandexcloud.net

      - name: Diagnose Yandex Cloud Registry
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
        run: |
          echo "=== Docker Registry /v2/ ==="
          curl -sS -i \
            -u "api_key:${YANDEX_API_KEY}" \
            "https://registry.yandexcloud.net/v2/" || true

          echo "=== Docker Registry catalog ==="
          curl -sS -i \
            -u "api_key:${YANDEX_API_KEY}" \
            "https://registry.yandexcloud.net/v2/_catalog" || true

      - name: Push Docker image
        run: |
          docker push \
            registry.yandexcloud.net/cn1jll5vhohtmitcgj18/habit-tracker:${{ github.sha }}

          docker push \
            registry.yandexcloud.net/cn1jll5vhohtmitcgj18/habit-tracker:latest